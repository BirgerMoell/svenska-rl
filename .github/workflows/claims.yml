name: Task claims
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  claim:
    if: github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9
        with:
          script: |
            await require('./scripts/claims.cjs').handle({github, context});
