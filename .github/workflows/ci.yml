name: Environment qualification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/claims.test.cjs
      - run: python3 scripts/build_site.py --check
      - run: python3 scripts/qualify.py --contract 0.2 --output-dir runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-v0.2-reports
          path: runs/*-contract.json
  tiny-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python3 scripts/qualify.py --contract 0.1 --output-dir runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-reports
          path: runs/*-l1.json
