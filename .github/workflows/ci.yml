name: Environment qualification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/claims.test.cjs
      - run: python3 scripts/build_site.py --check
  tiny-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python3 -m svrl.cli smoke invoice_totals --output runs/invoice-l1.json
          python3 -m svrl.cli smoke calendar_booking --output runs/calendar-l1.json
          python3 -m svrl.cli smoke inventory_order --output runs/inventory-l1.json
      - uses: actions/upload-artifact@v4
        with:
          name: l1-reports
          path: runs/*-l1.json
