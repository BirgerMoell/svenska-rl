[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svenska-rl"
version = "0.2.0"
description = "Agent-built Swedish RL environments and reproducible learning evidence"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
learn = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.4"]

[project.scripts]
svrl = "svrl.cli:main"

[tool.setuptools.packages.find]
include = ["svrl*", "environments*"]
